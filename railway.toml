[build]
builder = "NIXPACKS"

[build.nixpacksConfig]
# Railway auto-detects Python; override the pip install path so it picks up
# backend/requirements.txt (which includes the agent deps too).
# Delete this section if you want to keep the root requirements.txt instead.

[deploy]
startCommand = "uvicorn api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
